<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ספר המתכונים החכם</title>
<style>
  :root { --primary: #2b6cb0; --primary-dark: #1a365d; --bg: #f7fafc; --text: #2d3748; --border: #e2e8f0; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px; font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); color: var(--text); direction: rtl; line-height: 1.5; }
  .container { max-width: 1000px; margin: 0 auto; }
  .app-header { background: linear-gradient(135deg, var(--primary-dark), var(--primary)); color: #fff; padding: 18px 20px; border-radius: 12px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
  .app-title h1 { margin: 0; font-size: 18pt; }
  .app-title p { margin: 2px 0 0 0; font-size: 9.5pt; opacity: 0.9; }
  .btn { padding: 8px 14px; border-radius: 6px; font-size: 9.5pt; font-weight: 600; cursor: pointer; border: none; }

  .app-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn-green { background: #38a169; color: #fff; }
  .btn-green:hover { background: #2f855a; }
  .btn-light { background: #edf2f7; color: #4a5568; }
  .btn-light:hover { background: #e2e8f0; }

  /* Modal Dialog */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
    align-items: center; justify-content: center; z-index: 1000; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff; width: 100%; max-width: 620px; border-radius: 12px;
    max-height: 90vh; overflow-y: auto; padding: 22px; box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid #edf2f7; padding-bottom: 8px; }
  .modal-header h3 { margin: 0; font-size: 13.5pt; color: #1a202c; }
  .close-btn { background: none; border: none; font-size: 18pt; cursor: pointer; color: #a0aec0; }
  .form-group { margin-bottom: 10px; }
  .form-group label { display: block; font-size: 8.8pt; font-weight: 600; margin-bottom: 3px; color: #4a5568; }
  .form-control {
    width: 100%; padding: 7px 10px; border: 1px solid #cbd5e0; border-radius: 6px;
    font-size: 9.5pt; outline: none; font-family: inherit;
  }
  .form-control:focus { border-color: var(--primary); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .search-input { flex: 2; min-width: 200px; padding: 8px 12px; border: 2px solid var(--border); border-radius: 6px; font-size: 10pt; outline: none; background: #fff; }
  .category-chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 3; }
  .chip { padding: 6px 12px; border-radius: 16px; font-size: 8.5pt; font-weight: 600; cursor: pointer; background: #fff; border: 1px solid var(--border); color: #4a5568; }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .layout { display: grid; grid-template-columns: 280px 1fr; gap: 16px; }
  @media (max-width: 768px) { .layout { grid-template-columns: 1fr; } }
  .recipe-nav { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px; max-height: calc(100vh - 160px); overflow-y: auto; }
  .nav-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 3px; border-bottom: 1px solid #f7fafc; }
  .nav-item:hover { background: #ebf8ff; }
  .nav-item.active { background: #ebf8ff; border-right: 4px solid var(--primary); font-weight: 700; }
  .nav-item-title { font-size: 9.5pt; color: #1a202c; display: block; }
  .nav-item-sub { font-size: 8pt; color: #718096; }
  .recipe-viewer { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .recipe-meta-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #edf2f7; padding-bottom: 8px; margin-bottom: 14px; }
  .recipe-meta-header h2 { margin: 0; font-size: 15pt; color: #1a202c; }
  .author-tag { background: #ebf8ff; color: var(--primary); padding: 3px 8px; border-radius: 12px; font-size: 8.5pt; font-weight: 600; }
  .scaler-box { background: #ebf8ff; border: 1px solid #bee3f8; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  .scaler-title { font-weight: 700; color: var(--primary-dark); font-size: 10pt; margin-bottom: 8px; }
  .scaler-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  .scaler-item label { display: block; font-size: 8.5pt; font-weight: 600; color: #4a5568; margin-bottom: 3px; }
  .scaler-input-wrap { display: flex; align-items: center; background: #fff; border: 2px solid #cbd5e0; border-radius: 6px; overflow: hidden; }
  .scaler-input-wrap input, .scaler-input-wrap select { width: 100%; padding: 5px 8px; border: none; font-size: 10pt; font-weight: 700; text-align: center; outline: none; }
  .scaler-unit { padding: 0 8px; background: #edf2f7; color: #718096; font-size: 8.5pt; font-weight: 600; line-height: 32px; }
  .multiplier-btns { display: flex; gap: 4px; margin-top: 8px; align-items: center; }
  .m-btn { padding: 3px 8px; background: #fff; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 8pt; font-weight: 600; cursor: pointer; color: var(--primary); }
  .nutrition-table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 8.5pt; }
  .nutrition-table th, .nutrition-table td { padding: 5px 8px; border: 1px solid var(--border); text-align: right; }
  .nutrition-table th { background: #edf2f7; color: #4a5568; }
  .nutrition-table tr:nth-child(even) td { background: #fafbfc; }
  .val-num { font-weight: 700; color: var(--primary); }
  .recipe-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .recipe-columns { grid-template-columns: 1fr; } }
  .col-title { font-size: 10.5pt; font-weight: 700; color: #1a202c; border-bottom: 2px solid var(--border); padding-bottom: 4px; margin-bottom: 8px; }
  .ing-list { list-style: none; padding: 0; margin: 0; }
  .ing-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dashed #e2e8f0; font-size: 9pt; }
  .ing-qty { font-weight: 700; color: #2d3748; }
  .inst-list { padding-right: 16px; margin: 0; font-size: 8.8pt; color: #4a5568; line-height: 1.5; }
  .inst-list li { margin-bottom: 5px; }
</style>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://xtaeopklnjxvvnpqhgyx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_9-oJ5ZS2rxk65o9BUtiwoA_6rYxa-qz";
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
  </script>
</head>
<body>
<div class="container">
  <div class="app-header">
    <div class="app-title">
      <h1>ספר המתכונים החכם</h1>
      <p>מאגר מתכונים דינמי | חישוב כמויות ומאקרו בזמן אמת</p>
    </div>
    <div class="app-actions">
      <button class="btn btn-green" onclick="openAddModal()">➕ הוסף מתכון חדש</button>
      <button class="btn btn-light" onclick="exportData()">💾 ייצוא גיבוי</button>
      <button class="btn btn-light" onclick="document.getElementById('import-file').click()">📂 ייבוא גיבוי</button>
      <input type="file" id="import-file" style="display:none" onchange="importData(event)">
    </div>
  </div>

  <div class="filter-bar">
    <input type="text" id="search-box" class="search-input" placeholder="🔍 חפש מתכון או מחבר..." oninput="filterRecipes()">
    <div class="category-chips">
      <div class="chip active" onclick="setCategory('all', this)">הכל</div>
      <div class="chip" onclick="setCategory('עיקריות', this)">עיקריות</div>
      <div class="chip" onclick="setCategory('תוספות', this)">תוספות</div>
      <div class="chip" onclick="setCategory('רטבים', this)">רטבים</div>
      <div class="chip" onclick="setCategory('קינוחים', this)">קינוחים</div>
    </div>
  </div>

  <div class="layout">
    <div class="recipe-nav" id="recipe-list-nav"></div>
    <div class="recipe-viewer" id="recipe-view"></div>
  </div>
</div>

<script>
const defaultRecipes = [
  {
    id: "patties",
    title: "קציצות עוף, קינואה וירקות (30 יחידות)",
    author: "מעין",
    category: "עיקריות",
    basePortions: 30,
    primaryName: "חזה עוף טחון",
    primaryAmount: 1680,
    primaryUnit: "גרם",
    isMeat: false,
    nutrition: { cals: 3000, protein: 435, carbs: 204, fat: 45 },
    ingredients: [
      { name: "חזה עוף טחון", amount: 1680, unit: "גרם" },
      { name: "קינואה מבושלת", amount: 290, unit: "גרם" },
      { name: "בצל לבן/צהוב", amount: 550, unit: "גרם" },
      { name: "כרישה", amount: 380, unit: "גרם" },
      { name: "קישוא מגורר וסחוט", amount: 400, unit: "גרם" },
      { name: "פטרוזיליה טרייה", amount: 50, unit: "גרם" },
      { name: "ביצים (L)", amount: 2, unit: "יחידות" },
      { name: "פירורי לחם", amount: 30, unit: "גרם" }
    ],
    instructions: [
      "מגררים קישוא דק וסוחטים היטב לסילוק נוזלים. קוצצים דק בצל, כרישה ופטרוזיליה.",
      "בקערה מערבבים את כל המרכיבים והתבלינים למסה אחידה. מקררים 20 דקות.",
      "מחלקים ל-30 כדורים שווים (כ-115 גרם לקציצה).",
      "אופים ב-190°C–200°C כ-20–25 דקות, או מבשלים ברוטב מבעבע 25–30 דקות."
    ]
  }
];

let allRecipes = defaultRecipes;
let activeRecipeId = null;
let currentCategory = 'all';
let currentScale = 1.0;
let beefFatPercent = 15;

// --- Clean Root Architecture: Local-First with Safe Lazy Sync ---

function initApp() {
  try {
    const saved = localStorage.getItem('my_recipes_db');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) {
        allRecipes = parsed;
      }
    }
  } catch (e) {
    console.warn('Local read error:', e);
  }

  if (!activeRecipeId || !allRecipes.some(r => r.id === activeRecipeId)) {
    activeRecipeId = allRecipes[0]?.id || null;
  }

  renderNavList();
  renderActiveRecipe();

  if (supabaseClient) {
    async function fetchCloudAndMerge() {
  if (!supabaseClient) return;
  try {
    // שליפה מלאה ובטוחה בלי סינון ישיר שגורם לשגיאת 406
    const { data, error } = await supabaseClient
      .from('recipes')
      .select('*');

    if (error || !data || !Array.isArray(data)) return;

    // מציאת השורה של ה-master_db מתוך כלל התוצאות מקומית
    const masterRow = data.find(row => row.id === 'master_db');
    if (!masterRow || !masterRow.data || !Array.isArray(masterRow.data)) return;

    const cloudRecipes = masterRow.data;
    if (JSON.stringify(cloudRecipes) !== JSON.stringify(allRecipes)) {
      if (cloudRecipes.length >= allRecipes.length) {
        allRecipes = cloudRecipes;
        localStorage.setItem('my_recipes_db', JSON.stringify(allRecipes));
        if (!allRecipes.some(r => r.id === activeRecipeId)) {
          activeRecipeId = allRecipes[0]?.id || null;
        }
        renderNavList();
        renderActiveRecipe();
      }
    }
  } catch (err) {
    // שקט ברקע
  }
}
    if (error || !data || data.length === 0 || !data[0].data || !Array.isArray(data[0].data)) return;

    const cloudRecipes = data[0].data;
    if (JSON.stringify(cloudRecipes) !== JSON.stringify(allRecipes)) {
      if (cloudRecipes.length >= allRecipes.length) {
        allRecipes = cloudRecipes;
        localStorage.setItem('my_recipes_db', JSON.stringify(allRecipes));
        if (!allRecipes.some(r => r.id === activeRecipeId)) {
          activeRecipeId = allRecipes[0]?.id || null;
        }
        renderNavList();
        renderActiveRecipe();
      }
    }
  } catch (err) {}
}

async function persistToCloud() {
  if (!supabaseClient) return;
  try {
    localStorage.setItem('my_recipes_db', JSON.stringify(allRecipes));
    await supabaseClient
      .from('recipes')
      .upsert({ id: 'master_db', data: allRecipes });
  } catch (err) {
    console.warn('Cloud persistence warning:', err);
  }
}

// --- פונקציות ממשק ---

function renderNavList() {
  const navEl = document.getElementById('recipe-list-nav');
  const term = document.getElementById('search-box').value.trim().toLowerCase();
  const filtered = allRecipes.filter(r => {
    const matchCat = (currentCategory === 'all' || r.category === currentCategory);
    const matchSearch = (!term || r.title.toLowerCase().includes(term) || r.author.toLowerCase().includes(term));
    return matchCat && matchSearch;
  });
  navEl.innerHTML = filtered.map(r => `
    <div class="nav-item ${r.id === activeRecipeId ? 'active' : ''}" onclick="selectRecipe('${r.id}')">
      <span class="nav-item-title">${r.title}</span>
      <span class="nav-item-sub">מאת: ${r.author} | ${r.basePortions} מנות</span>
    </div>
  `).join('');
}

function selectRecipe(id) {
  activeRecipeId = id;
  currentScale = 1.0;
  renderNavList();
  renderActiveRecipe();
}

function renderActiveRecipe() {
  const r = allRecipes.find(item => item.id === activeRecipeId);
  const viewEl = document.getElementById('recipe-view');
  if (!r) {
    viewEl.innerHTML = '<p style="text-align:center; color:#718096; padding:20px;">בחר מתכון מהרשימה או הוסף מתכון חדש.</p>';
    return;
  }

  const scaledPortions = (r.basePortions * currentScale);
  const formattedPortions = (scaledPortions % 1 === 0) ? scaledPortions : scaledPortions.toFixed(1);

  let primaryControl = '';
  if (r.primaryName && r.primaryAmount) {
    const scaledPrimary = Math.round(r.primaryAmount * currentScale);
    primaryControl = `
      <div class="scaler-item">
        <label>${r.primaryName}:</label>
        <div class="scaler-input-wrap">
          <input type="number" value="${scaledPrimary}" step="50" oninput="scaleByPrimary(this.value)">
          <span class="scaler-unit">${r.primaryUnit || 'גרם'}</span>
        </div>
      </div>
    `;
  }

  let fatControl = '';
  if (r.isMeat) {
    fatControl = `
      <div class="scaler-item">
        <label>אחוז שומן בבקר:</label>
        <div class="scaler-input-wrap">
          <select onchange="changeFat(this.value)">
            <option value="5" ${beefFatPercent === 5 ? 'selected':''}>5% (רזה)</option>
            <option value="10" ${beefFatPercent === 10 ? 'selected':''}>10% (דל שומן)</option>
            <option value="15" ${beefFatPercent === 15 ? 'selected':''}>15% (קלאסי)</option>
            <option value="20" ${beefFatPercent === 20 ? 'selected':''}>20% (עשיר)</option>
          </select>
        </div>
      </div>
    `;
  }

  const nut = r.nutrition || { cals: 0, protein: 0, carbs: 0, fat: 0 };
  let cals = Math.round(nut.cals * currentScale);
  let protein = Math.round(nut.protein * currentScale);
  let carbs = Math.round(nut.carbs * currentScale);
  let fat = Math.round(nut.fat * currentScale);

  const perCals = scaledPortions > 0 ? Math.round(cals / scaledPortions) : 0;
  const perProtein = scaledPortions > 0 ? (protein / scaledPortions).toFixed(1) : 0;
  const perCarbs = scaledPortions > 0 ? (carbs / scaledPortions).toFixed(1) : 0;
  const perFat = scaledPortions > 0 ? (fat / scaledPortions).toFixed(1) : 0;

  viewEl.innerHTML = `
    <div class="recipe-meta-header">
      <div>
        <h2>${r.title}</h2>
        <span class="author-tag" style="margin-top:4px; display:inline-block;">מאת: ${r.author}</span>
      </div>
      <div>
        <button class="btn btn-light" onclick="openEditModal('${r.id}')" style="padding:5px 12px; font-size:9pt; border:1px solid #cbd5e0;">✏️ ערוך מתכון</button>
      </div>
    </div>

    <div class="scaler-box">
      <div class="scaler-title">⚡ התאמת כמויות ומנות בזמן אמת:</div>
      <div class="scaler-grid">
        ${primaryControl}
        <div class="scaler-item">
          <label>מספר מנות:</label>
          <div class="scaler-input-wrap">
            <input type="number" value="${formattedPortions}" min="0.5" step="0.5" oninput="scaleByPortions(this.value)">
            <span class="scaler-unit">מנות</span>
          </div>
        </div>
        ${fatControl}
      </div>
    </div>

    <table class="nutrition-table">
      <thead>
        <tr><th>ערך תזונתי</th><th>סך הכל למתכון</th><th>למנה בודדת</th></tr>
      </thead>
      <tbody>
        <tr><td><strong>קלוריות</strong></td><td class="val-num">${cals.toLocaleString()} קק"ל</td><td>${perCals} קק"ל</td></tr>
        <tr><td><strong>חלבון</strong></td><td class="val-num">${protein} גרם</td><td>${perProtein} גרם</td></tr>
        <tr><td><strong>פחמימות</strong></td><td class="val-num">${carbs} גרם</td><td>${perCarbs} גרם</td></tr>
        <tr><td><strong>שומן</strong></td><td class="val-num">${fat} גרם</td><td>${perFat} גרם</td></tr>
      </tbody>
    </table>

    <div class="recipe-columns">
      <div>
        <div class="col-title">מצרכים מעודכנים</div>
        <ul class="ing-list">
          ${(r.ingredients || []).map(ing => {
            const scaled = (typeof ing.amount === 'number') ? (ing.amount * currentScale) : ing.amount;
            const displayQty = (typeof scaled === 'number') ? (scaled % 1 === 0 ? scaled : scaled.toFixed(1)) : (scaled || '');
            return `<li class="ing-row"><span>${ing.name}</span><span class="ing-qty">${displayQty} ${ing.unit || ''}</span></li>`;
          }).join('')}
        </ul>
      </div>
      <div>
        <div class="col-title">הוראות הכנה</div>
        <ol class="inst-list">
          ${(r.instructions || []).map(item => `<li>${item}</li>`).join('')}
        </ol>
      </div>
    </div>
  `;
}

function scaleByPortions(val) {
  const num = parseFloat(val);
  const r = allRecipes.find(i => i.id === activeRecipeId);
  if (num > 0 && r) { currentScale = num / r.basePortions; renderActiveRecipe(); }
}

function scaleByPrimary(val) {
  const num = parseFloat(val);
  const r = allRecipes.find(i => i.id === activeRecipeId);
  if (num > 0 && r && r.primaryAmount) { currentScale = num / r.primaryAmount; renderActiveRecipe(); }
}

function changeFat(val) { beefFatPercent = parseInt(val); renderActiveRecipe(); }

function setCategory(cat, el) {
  currentCategory = cat;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderNavList();
}

function filterRecipes() { renderNavList(); }

function openAddModal() {
  document.getElementById('modal-heading').innerText = '➕ הוספת מתכון חדש לספר';
  document.getElementById('m-id').value = '';
  document.getElementById('new-recipe-form').reset();
  document.getElementById('add-modal').classList.add('open');
}

function openEditModal(id) {
  const r = allRecipes.find(item => item.id === id);
  if (!r) return;

  document.getElementById('modal-heading').innerText = '✏️ עריכת מתכון: ' + r.title;
  document.getElementById('m-id').value = r.id;
  document.getElementById('m-title').value = r.title || '';
  document.getElementById('m-author').value = r.author || '';
  document.getElementById('m-category').value = r.category || 'עיקריות';
  document.getElementById('m-portions').value = r.basePortions || '';
  document.getElementById('m-prim-name').value = r.primaryName || '';
  document.getElementById('m-prim-qty').value = r.primaryAmount || '';

  document.getElementById('m-cals').value = r.nutrition?.cals ?? '';
  document.getElementById('m-protein').value = r.nutrition?.protein ?? '';
  document.getElementById('m-carbs').value = r.nutrition?.carbs ?? '';
  document.getElementById('m-fat').value = r.nutrition?.fat ?? '';

  if (Array.isArray(r.ingredients)) {
    document.getElementById('m-ingredients').value = r.ingredients.map(ing => {
      const amt = ing.amount !== undefined && ing.amount !== null ? ing.amount : '';
      const un = ing.unit || '';
      return `${ing.name} | ${amt} | ${un}`.trim();
    }).join('\n');
  } else {
    document.getElementById('m-ingredients').value = '';
  }

  if (Array.isArray(r.instructions)) {
    document.getElementById('m-instructions').value = r.instructions.join('\n');
  } else {
    document.getElementById('m-instructions').value = '';
  }

  document.getElementById('add-modal').classList.add('open');
}

function closeAddModal() { document.getElementById('add-modal').classList.remove('open'); }

function saveNewRecipe(e) {
  e.preventDefault();
  const editId = document.getElementById('m-id').value;
  const title = document.getElementById('m-title').value.trim() || 'מתכון ללא שם';
  const author = document.getElementById('m-author').value.trim() || 'מעין';
  const category = document.getElementById('m-category').value || 'עיקריות';
  const portions = parseFloat(document.getElementById('m-portions').value) || 1;
  const primName = document.getElementById('m-prim-name').value.trim();
  const primQty = parseFloat(document.getElementById('m-prim-qty').value) || null;
  const cals = parseFloat(document.getElementById('m-cals').value) || 0;
  const protein = parseFloat(document.getElementById('m-protein').value) || 0;
  const carbs = parseFloat(document.getElementById('m-carbs').value) || 0;
  const fat = parseFloat(document.getElementById('m-fat').value) || 0;

  const ingLines = document.getElementById('m-ingredients').value.split('\n');
  const ingredients = ingLines.filter(l => l.trim()).map(l => {
    const parts = l.split('|');
    return {
      name: parts[0]?.trim() || '',
      amount: parseFloat(parts[1]?.trim()) || parts[1]?.trim() || '',
      unit: parts[2]?.trim() || ''
    };
  });

  const instructions = document.getElementById('m-instructions').value.split('\n').filter(l => l.trim());

  if (editId) {
    const index = allRecipes.findIndex(item => item.id === editId);
    if (index !== -1) {
      allRecipes[index] = {
        ...allRecipes[index],
        title, author, category,
        basePortions: portions,
        primaryName: primName || null,
        primaryAmount: primQty,
        nutrition: { cals, protein, carbs, fat },
        ingredients,
        instructions
      };
      activeRecipeId = editId;
    }
  } else {
    const newRecipe = {
      id: 'rec_' + Date.now(),
      title, author, category,
      basePortions: portions,
      primaryName: primName || null,
      primaryAmount: primQty,
      primaryUnit: 'גרם',
      isMeat: false,
      nutrition: { cals, protein, carbs, fat },
      ingredients,
      instructions
    };
    allRecipes.unshift(newRecipe);
    activeRecipeId = newRecipe.id;
  }

  persistToCloud();
  closeAddModal();
  document.getElementById('new-recipe-form').reset();
  currentScale = 1.0;
  renderNavList();
  renderActiveRecipe();
}

function exportData() {
  const blob = new Blob([JSON.stringify(allRecipes, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my_recipes_backup.json';
  a.click();
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data) && data.length > 0) {
        allRecipes = data;
        activeRecipeId = allRecipes[0]?.id;
        currentScale = 1.0;
        persistToCloud();
        renderNavList();
        renderActiveRecipe();
        alert('המאגר יובא בהצלחה!');
      }
    } catch(err) { alert('שגיאה בקריאת הקובץ'); }
  };
  reader.readAsText(file);
}

// הפעלת המערכת בעליית הדף
initApp();
</script>

<!-- Modal: Add New Recipe -->
<div class="modal-overlay" id="add-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-heading">➕ הוספת מתכון לספר</h3>
      <button class="close-btn" onclick="closeAddModal()">&times;</button>
    </div>
    <form id="new-recipe-form" onsubmit="saveNewRecipe(event)">
      <input type="hidden" id="m-id" value="">
      <div class="form-row">
        <div class="form-group">
          <label>שם המתכון:</label>
          <input type="text" id="m-title" class="form-control" placeholder="למשל: עראייס ביתי בתנור">
        </div>
        <div class="form-group">
          <label>מתכון מאת:</label>
          <input type="text" id="m-author" class="form-control" placeholder="מעין">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>קטגוריה:</label>
          <select id="m-category" class="form-control">
            <option value="עיקריות">מנות עיקריות וחלבון</option>
            <option value="תוספות">תוספות, פחמימות וירקות</option>
            <option value="רטבים">רטבים וממרחים</option>
            <option value="קינוחים">קינוחים ונשנושים</option>
          </select>
        </div>
        <div class="form-group">
          <label>מספר מנות בסיס:</label>
          <input type="number" id="m-portions" class="form-control" placeholder="4" min="0.5" step="0.5">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>מרכיב ראשי לסקלר (אופציונלי):</label>
          <input type="text" id="m-prim-name" class="form-control" placeholder="למשל: בשר טחון">
        </div>
        <div class="form-group">
          <label>כמות מרכיב ראשי (בגרמים):</label>
          <input type="number" id="m-prim-qty" class="form-control" placeholder="800">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>סך קלוריות:</label>
          <input type="number" id="m-cals" class="form-control" placeholder="0">
        </div>
        <div class="form-group">
          <label>חלבון (גרם):</label>
          <input type="number" id="m-protein" class="form-control" placeholder="0" step="0.1">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>פחמימות (גרם):</label>
          <input type="number" id="m-carbs" class="form-control" placeholder="0" step="0.1">
        </div>
        <div class="form-group">
          <label>שומן (גרם):</label>
          <input type="number" id="m-fat" class="form-control" placeholder="0" step="0.1">
        </div>
      </div>

      <div class="form-group">
        <label>מצרכים (שורה לכל מצרך, בפורמט: שם | כמות | יחידה):</label>
        <textarea id="m-ingredients" class="form-control" rows="4" placeholder="בשר טחון | 800 | גרם&#10;בצל קצוץ | 2 | יחידות&#10;טחינה | 2 | כפות"></textarea>
      </div>

      <div class="form-group">
        <label>הוראות הכנה (שורה לכל שלב):</label>
        <textarea id="m-instructions" class="form-control" rows="3" placeholder="מחממים תנור ל-200 מעלות...&#10;מערבבים את כל החומרים..."></textarea>
      </div>

      <button type="submit" class="btn btn-green" style="width:100%; padding:10px; font-size:10.5pt; margin-top:6px;">💾 שמור מתכון בספר</button>
    </form>
  </div>
</div>

</body>
</html>
